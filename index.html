<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>16 Guti Game</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background-color: #f4f6f9; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* Menu Styles */
        #menu-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .menu-title { color: white; font-size: 32px; margin-bottom: 40px; }
        .menu-btn { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; background: white; color: #2c3e50; border: none; border-radius: 25px; width: 250px; font-weight: bold; transition: 0.3s; }
        .menu-btn:active { transform: scale(0.95); }

        /* Game UI Styles */
        #game-ui { display: none; flex-direction: column; align-items: center; width: 100%; }
        .top-bar { width: 100%; max-width: 420px; display: flex; justify-content: flex-end; padding: 15px; }
        .menu-btn-small { font-size: 28px; cursor: pointer; color: #34495e; }
        #menu-content { display: none; position: absolute; right: 15px; top: 50px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 10; width: 180px; }
        #status-panel { margin: 10px; font-size: 18px; font-weight: bold; color: #2c3e50; background: white; padding: 10px 25px; border-radius: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: all 0.5s; border: 4px solid #bdc3c7; }
        .glow-1 { border-color: #2ecc71 !important; box-shadow: 0 0 20px #2ecc71 !important; color: #27ae60 !important; }
        .glow-2 { border-color: #e74c3c !important; box-shadow: 0 0 20px #e74c3c !important; color: #c0392b !important; }
        #game-container { position: relative; width: 95vw; height: 95vw; max-width: 420px; max-height: 420px; background: #fffdf9; border: 2.5px solid #34495e; border-radius: 8px; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #points-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        #score-panel { margin-top: 15px; width: 95vw; max-width: 420px; display: flex; justify-content: space-between; padding: 12px 25px; background: #34495e; color: white; border-radius: 10px; font-weight: bold; font-size: 16px; }
        .point { position: absolute; width: 34px; height: 34px; transform: translate(-50%, -50%); cursor: pointer; z-index: 3; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .guti { width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 3px 5px rgba(0,0,0,0.3); }
        .player1 { background: radial-gradient(circle, #2ecc71, #27ae60); }
        .player2 { background: radial-gradient(circle, #e74c3c, #c0392b); }
        .selected { transform: translate(-50%, -50%) scale(1.2); }
        .hint { background-color: rgba(241, 196, 15, 0.6); border: 2px solid #d35400; border-radius: 50%; width: 16px; height: 16px; }
        #win-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 20; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; text-align: center; }
        .btn-restart { margin-top: 20px; padding: 10px 25px; background: #34495e; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 30; border-radius: 50%; animation: fall 3s linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 class="menu-title">16 Guti Game</h1>
        <button class="menu-btn" onclick="startAI()">Play vs AI</button>
        <button class="menu-btn" onclick="startGame()">Play with Friend</button>
        <button class="menu-btn" onclick="alert('This feature will be updated soon!')">Coming Soon</button>
    </div>

    <div id="game-ui">
        <div id="win-modal">
            <div class="modal-content">
                <h2 id="winner-text">Winner!</h2>
                <button class="btn-restart" onclick="resetGame()">Play Again</button>
            </div>
        </div>
        <div class="top-bar">
            <div class="menu-btn-small" onclick="toggleMenu()">⋮</div>
            <div id="menu-content">
                <input type="checkbox" id="timer-toggle" checked onchange="toggleTimer()"> Timer<br>
                <input type="checkbox" id="sound-toggle" checked> Sound<br>
                <div style="margin-top:10px; cursor:pointer; color:blue;" onclick="location.reload()">🔄 Exit to Menu</div>
            </div>
        </div>
        <div id="status-panel">Green Player's Turn (30s)</div>
        <div id="game-container">
            <canvas id="board-canvas"></canvas>
            <div id="points-layer"></div>
        </div>
        <div id="score-panel">
            <span>Green Kills: <span id="score-1">0</span></span>
            <span>Red Kills: <span id="score-2">0</span></span>
        </div>
    </div>

<script>
    const canvas = document.getElementById('board-canvas'), ctx = canvas.getContext('2d'), pointsLayer = document.getElementById('points-layer'), statusPanel = document.getElementById('status-panel'), winModal = document.getElementById('win-modal');
    let points = [], selectedIndex = null, currentPlayer = 1, gutiCounts = { 1: 16, 2: 16 }, eatenCounts = { 1: 0, 2: 0 }, timer, timeLeft = 30, isTimerEnabled = true, isAiMode = false;

    function startAI() { isAiMode = true; startGame(); }

    function startGame() {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('game-ui').style.display = 'flex';
        resizeCanvas();
        startTimer();
    }

    function playSound(file) { 
        if(document.getElementById('sound-toggle').checked) {
            const audio = new Audio(file);
            audio.play().catch(e => console.log("Sound blocked by browser"));
        }
    }
    
    function vibrate() { if (navigator.vibrate) navigator.vibrate(50); }

    function startConfetti() {
        for(let i=0; i<100; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.backgroundColor = ['#2ecc71', '#e74c3c', '#f1c40f', '#3498db'][Math.floor(Math.random()*4)];
            c.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3000);
        }
    }

    const gridPositions = [{r:0,c:0,type:'main'},{r:0,c:2,type:'main'},{r:0,c:4,type:'main'},{r:0,c:6,type:'main'},{r:0,c:8,type:'main'},{r:2,c:0,type:'main'},{r:2,c:2,type:'main'},{r:2,c:4,type:'main'},{r:2,c:6,type:'main'},{r:2,c:8,type:'main'},{r:4,c:0,type:'main'},{r:4,c:2,type:'main'},{r:4,c:4,type:'main'},{r:4,c:6,type:'main'},{r:4,c:8,type:'main'},{r:6,c:0,type:'main'},{r:6,c:2,type:'main'},{r:6,c:4,type:'main'},{r:6,c:6,type:'main'},{r:6,c:8,type:'main'},{r:8,c:0,type:'main'},{r:8,c:2,type:'main'},{r:8,c:4,type:'main'},{r:8,c:6,type:'main'},{r:8,c:8,type:'main'},{r:1,c:1,type:'mid'},{r:1,c:3,type:'mid'},{r:1,c:5,type:'mid'},{r:1,c:7,type:'mid'},{r:3,c:1,type:'mid'},{r:3,c:3,type:'mid'},{r:3,c:5,type:'mid'},{r:3,c:7,type:'mid'},{r:5,c:1,type:'mid'},{r:5,c:3,type:'mid'},{r:5,c:5,type:'mid'},{r:5,c:7,type:'mid'},{r:7,c:1,type:'mid'},{r:7,c:3,type:'mid'},{r:7,c:5,type:'mid'},{r:7,c:7,type:'mid'}];

    function updateStatusDisplay() { const playerName = (currentPlayer === 1 ? "Green" : "Red"); statusPanel.innerText = `${playerName} Player's Turn (${timeLeft}s)`; statusPanel.className = (currentPlayer === 1 ? 'glow-1' : 'glow-2'); }
    function resizeCanvas() { const rect = document.getElementById('game-container').getBoundingClientRect(); canvas.width = rect.width; canvas.height = rect.height; initPoints(); drawBoard(); createPointElements(); renderGuti(); }
    
    function initPoints() { points = []; const w = canvas.width, padding = w * 0.08, cellSize = (w - padding * 2) / 8; gridPositions.forEach((pos, index) => { let player = (pos.r < 3 || (pos.r === 3 && (pos.c === 1 || pos.c === 7))) ? 2 : (pos.r > 5 || (pos.r === 5 && (pos.c === 1 || pos.c === 7))) ? 1 : 0; points.push({ id: index, r: pos.r, c: pos.c, type: pos.type, x: padding + pos.c * cellSize, y: padding + pos.r * cellSize, player: player }); }); }
    
    function createPointElements() {
        pointsLayer.innerHTML = '';
        points.forEach((p, index) => {
            const div = document.createElement('div');
            div.className = 'point';
            div.id = `pt-${index}`;
            div.style.left = `${p.x}px`; div.style.top = `${p.y}px`;
            div.onclick = () => onPointClick(index);
            pointsLayer.appendChild(div);
        });
    }

    function renderGuti() {
        points.forEach((p, index) => {
            const div = document.getElementById(`pt-${index}`);
            div.innerHTML = '';
            if (p.player !== 0) {
                const guti = document.createElement('div');
                guti.className = `guti player${p.player}`;
                div.appendChild(guti);
            }
            div.className = 'point' + (selectedIndex === index ? ' selected' : '');
        });
    }

    function drawBoard() { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2.5; for(let i=0; i<5; i++){ ctx.beginPath(); ctx.moveTo(points[i*5].x, points[i*5].y); ctx.lineTo(points[i*5+4].x, points[i*5+4].y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(points[i].x, points[i].y); ctx.lineTo(points[20+i].x, points[20+i].y); ctx.stroke(); } for(let r=0; r<8; r+=2){ for(let c=0; c<8; c+=2){ let p1 = points.find(p=>p.r==r && p.c==c), p2 = points.find(p=>p.r==r+2 && p.c==c+2), p3 = points.find(p=>p.r==r && p.c==c+2), p4 = points.find(p=>p.r==r+2 && p.c==c); if(p1&&p2){ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();} if(p3&&p4){ctx.beginPath();ctx.moveTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.stroke();} } } }
    function showHints(fromIndex) { const fromPoint = points[fromIndex]; points.forEach((p, idx) => { let div = document.getElementById(`pt-${idx}`); div.classList.remove('hint'); if (p.player === 0 && (isNeighbor(fromPoint, p) || (getMiddlePoint(fromPoint, p) !== null && points[getMiddlePoint(fromPoint, p)].player !== 0 && points[getMiddlePoint(fromPoint, p)].player !== currentPlayer))) div.classList.add('hint'); }); }
    
    function onPointClick(index) {
        if (isAiMode && currentPlayer === 2) return;
        if (points[index].player === currentPlayer) { selectedIndex = index; renderGuti(); showHints(index); }
        else if (selectedIndex !== null && points[index].player === 0) { const from = points[selectedIndex], to = points[index], mid = getMiddlePoint(from, to); if (isNeighbor(from, to)) executeMove(selectedIndex, index); else if (mid !== null && points[mid].player !== 0 && points[mid].player !== currentPlayer) executeMove(selectedIndex, index, mid); }
    }

    function isNeighbor(p1, p2) { let rD = Math.abs(p1.r - p2.r), cD = Math.abs(p1.c - p2.c); return (rD === 1 && cD === 1) || (p1.type === 'main' && p2.type === 'main' && ((rD === 2 && cD === 0) || (rD === 0 && cD === 2))); }
    function getMiddlePoint(p1, p2) { let rD = p2.r - p1.r, cD = p2.c - p1.c; if ((Math.abs(rD) === 2 && Math.abs(cD) === 2) || (p1.type === 'main' && p2.type === 'main' && ((Math.abs(rD) === 4 && cD === 0) || (Math.abs(cD) === 4 && rD === 0)))) return points.findIndex(p => p.r === p1.r + rD / 2 && p.c === p1.c + cD / 2); return null; }
    
    function executeMove(from, to, capturedIndex = null) {
        vibrate();
        points[to].player = currentPlayer; points[from].player = 0;
        let canContinue = false;
        if (capturedIndex !== null) {
            points[capturedIndex].player = 0; gutiCounts[currentPlayer === 1 ? 2 : 1]--;
            eatenCounts[currentPlayer]++;
            document.getElementById(`score-${currentPlayer}`).innerText = eatenCounts[currentPlayer];
            playSound('capture.mp3');
            if (canEatAgain(to)) { selectedIndex = to; canContinue = true; }
        } else { playSound('move.mp3'); }
        
        if (canContinue) { 
            renderGuti(); 
            showHints(selectedIndex); 
            if (isAiMode && currentPlayer === 2) {
                setTimeout(() => aiMove(to), 800);
            }
            return; 
        }
        selectedIndex = null;
        
        if (gutiCounts[1] === 0 || gutiCounts[2] === 0) { 
            document.getElementById('winner-text').innerText = (gutiCounts[1] === 0 ? "Red Winner!" : "Green Winner!");
            winModal.style.display = "flex"; playSound('win.mp3'); clearInterval(timer); startConfetti();
        } else { 
            currentPlayer = currentPlayer === 1 ? 2 : 1; 
            startTimer(); 
            renderGuti(); 
            if(isAiMode && currentPlayer === 2) aiMove(); 
        }
    }
    
    function aiMove(forcedIndex = null) {
        setTimeout(() => {
            let possibleMoves = [];
            let activeGuti = forcedIndex !== null ? [points[forcedIndex]] : points.filter(p => p.player === 2);
            activeGuti.forEach((p) => { 
                points.forEach((target, j) => { 
                    if(target.player === 0) {
                        let mid = getMiddlePoint(p, target);
                        if(mid !== null && points[mid].player === 1) possibleMoves.push({f: p.id, t: j, m: mid});
                        else if(forcedIndex === null && isNeighbor(p, target)) possibleMoves.push({f: p.id, t: j, m: null});
                    }
                }); 
            });
            let captureMoves = possibleMoves.filter(m => m.m !== null);
            let move = captureMoves.length > 0 ? captureMoves[0] : (possibleMoves.length > 0 ? possibleMoves[Math.floor(Math.random() * possibleMoves.length)] : null);
            if(move) executeMove(move.f, move.t, move.m);
            else if(forcedIndex === null) { currentPlayer = 1; startTimer(); renderGuti(); }
        }, 800);
    }

    function canEatAgain(idx) { let p = points[idx]; return points.some(t => t.player === 0 && getMiddlePoint(p, t) !== null && points[getMiddlePoint(p, t)].player !== 0 && points[getMiddlePoint(p, t)].player !== currentPlayer); }
    function toggleMenu() { document.getElementById('menu-content').style.display = (document.getElementById('menu-content').style.display === 'block') ? 'none' : 'block'; }
    function resetGame() { currentPlayer = 1; gutiCounts = { 1: 16, 2: 16 }; eatenCounts = { 1: 0, 2: 0 }; document.getElementById('score-1').innerText = 0; document.getElementById('score-2').innerText = 0; selectedIndex = null; winModal.style.display = "none"; initPoints(); renderGuti(); startTimer(); toggleMenu(); }
    function toggleTimer() { isTimerEnabled = document.getElementById('timer-toggle').checked; if(!isTimerEnabled) { clearInterval(timer); statusPanel.className = ""; statusPanel.innerText = (currentPlayer === 1 ? "Green" : "Red") + " Player's Turn"; } else startTimer(); }
    function startTimer() { if(!isTimerEnabled) return; clearInterval(timer); timeLeft = 30; updateStatusDisplay(); timer = setInterval(() => { timeLeft--; updateStatusDisplay(); if(timeLeft <= 0) { clearInterval(timer); currentPlayer = (currentPlayer === 1 ? 2 : 1); startTimer(); renderGuti(); if(isAiMode && currentPlayer === 2) aiMove(); } }, 1000); }
    window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
